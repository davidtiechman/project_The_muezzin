version: '3.8'

services:
  elasticsearch:
    container_name: idf-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g   # זיכרון (אפשר לשנות לפי הצורך)
    ports:
      - "9200:9200"
    networks:
      - idf-net

  kibana:
    container_name: idf-kibana
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - idf-net

networks:
  idf-net:
    name: idf-network
