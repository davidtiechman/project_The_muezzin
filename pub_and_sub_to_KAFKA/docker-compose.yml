services:
  zookeeper:
    container_name: zookeeper-idf
    image: bitnami/zookeeper:3.8
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    ports:
      - "2181:2181"
    networks:
      - kafka-zook

  kafka:
    container_name: kafka-idf
    image: bitnami/kafka:3.7
    ports:
      - "9099:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
    depends_on:
      - zookeeper
    networks:
      - kafka-zook

networks:
  kafka-zook:
    name: idf-kafka
